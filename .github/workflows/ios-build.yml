# iOS build of the WZX Player (iPhone + iPad, one build), not the editor.
# Runs on a GitHub macOS runner and produces an unsigned .ipa artifact.
# Signing happens on the PC with Sideloadly (free Apple ID) or, later, with an Apple Developer account for TestFlight.
# Rendering: the Lit renderer (src/lit) on Diligent Engine, Vulkan translated to Metal by MoltenVK.
# Test build: the game of the editor (Studio scene, graph game/main.graph.json, houses of assets/HOUSE, HUD).
name: iOS build

on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-bzoypd]
    paths: [player/**, src/vp3d/**, src/lit/**, src/game/**, src/app/Content.*, game/**, assets/HOUSE/**, third_party/imgui/**, .github/workflows/ios-build.yml]

env:
  MOLTENVK_VERSION: v1.4.1

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: MoltenVK (static library for iOS)
        run: |
          curl -sSL -o MoltenVK-ios.tar \
            "https://github.com/KhronosGroup/MoltenVK/releases/download/${MOLTENVK_VERSION}/MoltenVK-ios.tar"
          tar xf MoltenVK-ios.tar
          echo "MOLTENVK_LIBRARY=$PWD/MoltenVK/MoltenVK/static/MoltenVK.xcframework/ios-arm64/libMoltenVK.a" >> "$GITHUB_ENV"

      - name: Configure (Xcode project)
        run: |
          cmake -S player -B build/ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_XCODE_GENERATE_SCHEME=ON -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DMOLTENVK_LIBRARY="$MOLTENVK_LIBRARY"

      # xcodebuild -target (no scheme needed); signing is disabled, Sideloadly signs on the PC.
      - name: Build unsigned .app
        run: |
          cmake --build build/ios --config Release --target WZXPlayer -- \
            -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package .ipa
        run: |
          APP=$(find build/ios -path "*Release-iphoneos/WZXPlayer.app" -maxdepth 3 -type d | head -1)
          test -n "$APP" || { echo "No .app built"; find build/ios -name "*.app"; exit 1; }
          # the game must be inside the app: graph, house model, shaders
          test -f "$APP/game/main.graph.json" && test -d "$APP/assets/HOUSE" && test -d "$APP/shaders" || { ls -R "$APP"; exit 1; }
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build && zip -qr WZXPlayer-unsigned.ipa Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: WZXPlayer-unsigned
          path: build/WZXPlayer-unsigned.ipa
